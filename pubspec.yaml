name: paper_boat_pulse
description: A responsive Flutter UI benchmark for Paper Boat Tech.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand_mark.svg
    - assets/brand_mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand_mark.png
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/brand_mark.png
